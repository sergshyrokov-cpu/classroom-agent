    # failure alike), OD-004 (one SyncState row updated in place), OD-005 (a
    # skipped run is logged, never written — BR-026), OD-006 (the first run waits
    # for the first legitimacy determination) and OD-007 (the one-run-at-a-time
    # coordinator is built here) were all resolved by the Owner on 2026-09-27 as
    # option 1, before activation.
  - id: US-014
    epic: EPIC-1
    title: Sync courses and rosters
    state: COMPLETED
    blocked_by: >
      Depends on US-013.
    # US-013 COMPLETED. Story file authored:
    # docs/stories/US-014-sync-courses-and-rosters.md. OD-001 (the "course older
    # than N years" rule is NOT applied here — this Story sees only the course's
    # own update time, and refusing a course would also hide its coursework from
    # US-015), OD-002 (no courseStates filter; the state is stored as Classroom
    # reports it), OD-003 (courses.list without a per-user filter; verifying the
    # technical account's Workspace roles stays a deployment task, §7 item 10),
    # OD-004 (ownerId as a plain column, no foreign key), OD-005 (the run counter
    # counts courses), OD-006 (the roster is imported as given, including entries
    # outside the domain and without an email), OD-007 (a full pass here;
    # BR-042 incremental behaviour is US-018), OD-008 (no failure classification
    # here; US-017 owns error policy) and OD-009 (one transaction per course)
    # were all resolved by the Owner on 2026-09-27 as option 1, before activation.
  - id: US-015
    epic: EPIC-1
    title: Sync coursework and submissions
    state: COMPLETED
    blocked_by: >
      Depends on US-014 (courses and memberships the submissions belong to).
    # US-014 COMPLETED. Story file authored:
    # docs/stories/US-015-sync-coursework-and-submissions.md. OD-001 (the §5 age
    # rule IS applied here — a course not yet in the database whose last
    # activity is older than N is not imported at all, so this Story is the
    # first to read the retention setting N), OD-002 (submissions requested once
    # per course with courseWorkId = "-"), OD-003 (US-014's boundary kept — one
    # transaction per course, now including its work and submissions), OD-004
    # (only PUBLISHED work and materials are imported; the Classroom state is
    # not stored), OD-006 (a submitter never seen on a roster gets a participant
    # from the Google userId alone), OD-007 (a Submission stores Google's
    # updateTime, and PC-13 is corrected), OD-008 (one CourseWork entity, the
    # kind derived) and OD-009 (the last turn-in date comes from the history
    # inline in the submission, which is never stored) were resolved by the
    # Owner on 2026-09-28 as option 1, before activation. OD-005 was resolved as
    # option 4 — deliberately not the US-014 OD-010 answer: an unrecognised
    # submission state is STORED with a marker and the raw string, because a
    # skipped submission would read as «не сдано» (BR-056) and state something
    # false about a child's work.
