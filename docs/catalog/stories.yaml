# =============================================================================
# CANONICAL STORY LIFECYCLE STATUS REGISTRY
# =============================================================================
# Authoritative source for each Story's lifecycle status.
#
# Owner: story-orchestrator — it updates the active Story's `state` on
#        activation and on COMPLETED. There is no backlog-sync stage in this
#        workflow variant: Stories are authored by a human in docs/stories/
#        and registered here by hand.
#
# Story Markdown files under docs/stories/ do NOT carry a mutable status field.
#
# state enum: BACKLOG | READY | IN_PROGRESS | COMPLETED
#
#   BACKLOG     — a candidate from docs/product/epic-map.md; no Story file yet
#   READY       — the Story file exists in docs/stories/ and may be activated
#   IN_PROGRESS — currently moving through the delivery workflow
#   COMPLETED   — approved at HUMAN_PR_APPROVAL; Done once the final commit lands
#
# Delivery order follows epic-map.md: EPIC-8 (bootstrap) → EPIC-6 → EPIC-1 →
# EPIC-2/5 → EPIC-3 → EPIC-4. EPIC-9 and EPIC-10 belong to the next version and
# are listed last. The other future epics — EPIC-7, EPIC-11, EPIC-12 and EPIC-13
# (trebovaniya.md section 4) — have no Stories yet; epic-map.md keeps their
# deferred scope.
#
# Stories marked `blocked_by` must not be activated until what is named there is
# in place: a decision (an open question in section 7, a missing cell in the
# permission matrix of section 2) or another Story being COMPLETED. Story
# dependencies record the technical delivery order — what must already exist for
# the Story to be built and tested — not business decisions.
#
# Every Story that writes or calls Google also proves read-only behaviour (TC-5);
# US-007 is not repeated in each `blocked_by` because EPIC-8 precedes all of them.
# =============================================================================
version: 1

