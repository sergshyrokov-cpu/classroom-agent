  - "SPECIFICATION FR-011 inverts the import order for an UNKNOWN course, which is the structural change DB_DESIGN and TEST_WRITING must plan for: before anything is written, the run reads that course's coursework, materials and submissions, computes the last activity from those plus the course's own update time, and writes NOTHING for the course if it is older than N - no course row, no participant, no membership, no coursework, no submission. An already-imported course is updated as before. A skipped course is not a failure and is not counted."
  - "US-015 carries NINE Open Decisions written into the Story, all resolved by the Owner on 2026-09-28 before activation. EIGHT are option 1: OD-001 (the §5 age rule IS applied here - for a course not yet in the database the run reads its coursework, materials and submissions first, computes the last activity from those plus the course's own update time, and imports NOTHING for a course older than N, while a course already in the database is always updated; this Story is therefore the FIRST to read the retention setting N, which DC-3 and PC-11 make required at startup), OD-002 (submissions requested ONCE per course with courseWorkId = \"-\", paged; the call shape is unverified against a live domain because the prototype only ever called it per assignment), OD-003 (US-014's boundary unchanged - ONE transaction per course, now covering the course, its roster, its coursework and its submissions together), OD-004 (only PUBLISHED coursework and materials are imported and the Classroom state is NOT stored; a deleted item keeps the row it has, as US-014 leaves a vanished course), OD-006 (a submitter never seen on a roster gets a participant from the Google userId ALONE, name and email absent, and a student membership off the roster with both dates on this run - no profile call, so no unverified Workspace role is relied on), OD-007 (a Submission DOES store Google's updateTime), OD-008 (ONE CourseWork entity with a stored \"which Classroom resource\" field, PC-3's key on (resource, google id), and the BR-052 kind derived and never stored) and OD-009 (the last turn-in date is the LATEST transition to TURNED_IN taken from the history inline in the submission resource; the history itself is never stored, and a submission whose history Google omits has NO date rather than an invented one)."
  - "US-015 carries NINE Open Decisions written into the Story, all resolved by the Owner on 2026-09-28 before activation. EIGHT are option 1: OD-001 (the §5 age rule IS applied here - for a course not yet in the database the run reads its coursework, materials and submissions first, computes the last activity from those plus the course's own update time, and imports NOTHING for a course older than N, while a course already in the database is always updated; this Story is therefore the FIRST to read the retention setting N, which DC-3 and PC-11 make required at startup), OD-002 (submissions requested ONCE per course with courseWorkId = \"-\", paged; the call shape is unverified against a live domain because the prototype only ever called it per assignment), OD-003 (US-014's boundary unchanged - ONE transaction per course, now covering the course, its roster, its coursework and its submissions together), OD-004 (only PUBLISHED coursework and materials are imported and the Classroom state is NOT stored; a deleted item keeps the row it has, as US-014 leaves a vanished course), OD-006 (a submitter never seen on a roster gets a participant from the Google userId ALONE, name and email absent, and a student membership off the roster with both dates on this run - no profile call, so no unverified Workspace role is relied on), OD-007 (a Submission DOES store Google's updateTime), OD-008 (ONE CourseWork entity with a stored \"which Classroom resource\" field, PC-3's key on (resource, google id), and the BR-052 kind derived and never stored) and OD-009 (the last turn-in date is the LATEST transition to TURNED_IN taken from the history inline in the submission resource; the history itself is never stored, and a submission whose history Google omits has NO date rather than an invented one)."
  - "US-015 OD-005 was resolved as option 4 - deliberately NOT the US-014 OD-010 answer, and the reason is the finding most worth carrying into SPECIFICATION. A skipped COURSE is visibly absent from the Dean's list; a skipped SUBMISSION is not absent at all, because BR-056 reads a missing submission as «не сдано» - a false statement about one child's work. So the submission row is ALWAYS stored: the state is a closed vocabulary with a check constraint for every recognised value, PLUS an explicit «unrecognised» marker keeping the raw string Google sent, with one Warning line carrying that string and the submission id and nothing else (SC-10). Three obligations follow: the Specification must list the EXACT vocabulary values; it must record that BR-056's list - including STUDENT_EDITED_AFTER_TURN_IN - is UNVERIFIED against a live Classroom response, because the prototype never read a submission state at all (it reads only userId and assignedGrade, google_api.py:224-225); and US-025 inherits a rule BR-056 does not describe - an unrecognised state is rendered as its own thing, never as «не сдано» and never as a grade."
  - "US-015 OD-007 obliges this Story to CORRECT a derived document, which is why it must not be forgotten at IMPLEMENTATION: persistence-conventions.md PC-13 lists what a Submission stores and OMITS Google's updateTime, while PC-11 - derived from the same §5 - requires «update of any of its Submission rows» for a course's last activity. trebovaniya.md §5 v36 already says «изменение любой сдачи», so the requirement is unchanged and only the convention is wrong; per AGENTS.md the derived document is the one that gets fixed. The local updated_at of PC-6 is NOT a substitute: it records when this program wrote the row, so reimporting a school would refresh every row and postpone every expiry - a purge wrong in a way nobody could see."
  - "US-015 scope grew beyond US-014's shape in one way SPECIFICATION must honour: because OD-001 applies the age rule, the Story reads the retention setting N for the first time in the project and DC-3 / PC-11 make an installation without it refuse to start. That is a deployment-affecting change inside a synchronization Story, accepted deliberately because the import order inverts for an unknown course (read its work, then decide) and US-037 would otherwise have to rewrite the pipeline this Story builds. AC-010 was added for the rule; AC-001 … AC-009 keep their numbers."
  - "Prototype evidence gathered before activation, with its gap: google_api.py pages courseWork().list (:163) and courseWorkMaterials().list (:176) and reads submissions PER ASSIGNMENT (:210); its date cascade (:107-124) is exactly §3's scheduledTime -> dueDate -> updateTime -> creationTime. But db.py has only three tables (courses, metadata, users) - NO coursework, material or submission table at all - and from a submission the prototype reads only userId and assignedGrade, never a state, a draft grade, a late flag or a history. So it is evidence for HOW to call Classroom and for NOTHING about what to store. Its retry codes (429, 500, 502, 503, 504, exponential backoff) belong to US-017."
  - "Existing code and conventions US-015 builds on, verified before activation: IClassroomReader already exists, already carries IGoogleDataPort, and that marker is what makes US-007 FR-007 bind - ReadOnlyEnforcementTests applies the rule by reflection over the real Application assembly, so extending the existing port keeps the protection automatically while a NEW port would have to carry the same marker. GoogleDelegationScopes already holds classroom.coursework.students.readonly and classroom.courseworkmaterials.readonly, so NO seventh scope is needed. package-map.md already names the entities CourseWork and Submission and the enums CourseWorkKind (computed, never stored) and SubmissionState. PC-3 already fixes the CourseWork key as (Classroom resource, Google id), because ids from the two resources may collide."
  - "Carried from US-014, not US-015's to correct: the SECURITY_REVIEW F-1 (Minor) unbounded state / googleId in the skipped-course Warning line, recommended for US-017; I-3 formula injection in a future .xlsx export, carried to US-024; I-5 a course with a BLANK NAME fails the whole run rather than being skipped, US-017's to settle; and the TimestampInterceptor gap for SyncState and WorkspaceConnection, a pre-existing defect of US-009 / US-013."
  - "Carried from the US-011 security review: F-2 (Minor) - no test resolves a real adapter from the composition root. Not owned by US-015, recorded so it is not lost."
