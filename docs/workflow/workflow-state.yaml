  - "US-012 carries four Open Decisions written into the Story, all resolved by the Owner on 2026-09-26 as option 1 before activation: OD-001 (one Story — the Admin's four management actions AND the Dean's sign-in, forced temporary-password change and self-service change together, because BR-014's temporary-password rule spans both sides and a split would leave AC-012 unprovable), OD-002 (keep the hand-written AppUser and add only IPasswordHasher<AppUser> from Microsoft.Extensions.Identity.Core, as the Control Plane already does for the Owner — this IS the NuGet approval AGENTS.md requires; no UserManager or SignInManager, since SC-2 forbids building the six-step sequence on them), OD-003 (the Dean list shows email, state, whether the password is temporary, and the last successful sign-in date; no search and no paging in v1) and OD-004 (a mistyped email is not corrected — the Admin disables the wrong account and creates the correct one; changing an account's email stays undefined and would need a new rule in trebovaniya.md §2). SPECIFICATION carries them into docs/decisions/US-012-open-decisions.md keeping their OD- ids."
  - "US-012 is a large Story by the Owner's explicit decision (OD-001): the Admin's Dean-accounts screen with four actions, the Dean sign-in page with the six-step SC-2 check sequence, the 5/15 lockout, the forced temporary-password change and the Dean's own password change, plus one amending migration, new audit members and two sets of translations. SPECIFICATION is expected to reflect that size rather than trim it."
