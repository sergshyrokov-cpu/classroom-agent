  - "US-015 OD-005 was resolved as option 4 - deliberately NOT the US-014 OD-010 answer, and the reason is the finding most worth carrying into SPECIFICATION. A skipped COURSE is visibly absent from the Dean's list; a skipped SUBMISSION is not absent at all, because BR-056 reads a missing submission as «не сдано» - a false statement about one child's work. So the submission row is ALWAYS stored: the state is a closed vocabulary with a check constraint for every recognised value, PLUS an explicit «unrecognised» marker keeping the raw string Google sent, with one Warning line carrying that string and the submission id and nothing else (SC-10). Three obligations follow: the Specification must list the EXACT vocabulary values; it must record that BR-056's list - including STUDENT_EDITED_AFTER_TURN_IN - is UNVERIFIED against a live Classroom response, because the prototype never read a submission state at all (it reads only userId and assignedGrade, google_api.py:224-225); and US-025 inherits a rule BR-056 does not describe - an unrecognised state is rendered as its own thing, never as «не сдано» and never as a grade."
  - "US-015 OD-007 obliges this Story to CORRECT a derived document, which is why it must not be forgotten at IMPLEMENTATION: persistence-conventions.md PC-13 lists what a Submission stores and OMITS Google's updateTime, while PC-11 - derived from the same §5 - requires «update of any of its Submission rows» for a course's last activity. trebovaniya.md §5 v36 already says «изменение любой сдачи», so the requirement is unchanged and only the convention is wrong; per AGENTS.md the derived document is the one that gets fixed. The local updated_at of PC-6 is NOT a substitute: it records when this program wrote the row, so reimporting a school would refresh every row and postpone every expiry - a purge wrong in a way nobody could see."
