  - "HUMAN_SPEC_APPROVAL approved by Serhii SHYROKOV (/so:approve) at 2026-09-27T11:52:20Z (no comment): Specification v1 and open decisions v1 accepted; automated verdict PASS with no blocking findings. OD-001 ... OD-007 arrived resolved; interpretations I-1 ... I-8 accepted as written, with ONE CHANGED AT THE GATE: I-6, the default run interval, was lowered from 6 hours to 1 HOUR on the Owner's decision, because until US-019 adds the manual trigger there is no way to ask for a run by hand and an hour keeps a school day's data current; the cost is nothing while the pipeline is empty, and the value can be raised by configuration once US-014 and US-015 make a run measurable. FR-013 and I-6 were corrected before approval, so the Specification was approved at version 1 (it was still DRAFT and the gate had not passed). The Specification's status is now APPROVED."
  - "SPECIFICATION: PASS. 18 functional requirements, 6 validation rules, 12 security requirements, interpretations I-1 ... I-8, all 9 Acceptance Criteria traced. OD-001 ... OD-007 arrived resolved and are carried into docs/decisions/US-013-open-decisions.md unchanged; no new Open Decision was raised, and trebovaniya.md §7 holds no item that blocks this Story (items 10 and 14 are untouched because the Story makes no Google call). No automated spec reviewer exists in this variant, so HUMAN_SPEC_APPROVAL was the only check that the Specification reflects trebovaniya.md v79."
  - "SPECIFICATION interpretations API_DESIGN and DB_DESIGN must honour: I-1 (a run completing with a ZERO counter is success, not a defect - OD-001 leaves the pipeline empty until US-014); I-2 (no SyncState row means the installation has never synchronized - §3 gives three status values and none describes the never-run case, so the row is created by the first run rather than seeded or given a fourth value); I-3 (a row left at Running by a crashed or stopped process is TOLERATED, not prevented - the next run overwrites it and readiness, not SyncState, tells the Owner the service is down; writing a fourth status §3 does not define was rejected); I-4 (a skipped run is logged at Information, because DC-10 assigns Warning to ENTERING read-only mode, not to every run skipped while it lasts); I-5 (the wait for the first legitimacy determination is bounded by one interval, so a stalled check cannot stop synchronization for the life of the process); I-6 (the DEFAULT interval is 1 HOUR, decided by the Owner at the gate on 2026-09-27; 6 hours, matching BR-024's cadence, was considered and rejected as too stale for a school day); I-7 (a failed run is logged at Error, because DC-10 reserves Warning for RETRIED transient failures and this Story neither classifies nor retries - US-017 may lower the retried cases later); I-8 (ONE counter, because §3 says «счётчик» in the singular)."
  - "SPECIFICATION FR-016 for API_DESIGN: this Story adds NO endpoint, NO page, NO authorization policy and NO route. SC-4's anonymous list is unchanged and the US-008 endpoint enumeration test gains no row; the readiness endpoint keeps its place on the private port behind the existing port filter. API_DESIGN may therefore be NOT_APPLICABLE under the stage's optional_when - the Specification states explicitly that the Story does not change public API behaviour. The out-of-schedule entry point of FR-004 is an in-process coordinator member, not an HTTP operation; US-019 adds the endpoint."
