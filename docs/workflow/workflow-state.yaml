non_blocking_findings:
  - "API_DESIGN: PASS. TEN server-rendered operations on the installation public port, in three groups: /settings/deans (GET list+form, POST create, POST /{deanId}/state, POST /{deanId}/password), /sign-in (GET extended, POST new) with /sign-in/change-password (GET, POST), and /account/password (GET, POST). No /api/v1 path, no Control Plane endpoint, no Contracts type; ContractVersion stays 1. YAML parsed. Nothing in this Story calls Google."
  - "API_DESIGN 2.1: the four BR-014 actions are expressed without verbs in paths - create is POST /settings/deans, disable and re-enable are ONE operation POST /{deanId}/state carrying desiredState (Active|Disabled), reset is POST /{deanId}/password. There is no DELETE anywhere, which is AC-008 expressed as contract."
  - "API_DESIGN 2.3: POST /sign-in answers 302 for EVERY outcome of the six-step sequence - the outcome is in the Location and in TempData, never in the status code. Steps 1, 2 and 3 share both the redirect target and the message key; step 4 differs only in the key; steps 5 and 6 differ only in the Location. A refused sign-in is deliberately NOT 401, because a distinguishing status would be the oracle SC-2 forbids."
  - "API_DESIGN 2.4: the SC-4 anonymous list grows by one METHOD, POST /sign-in, not by a page - the Dean form joins the /sign-in page US-008 already serves anonymously. The US-008 endpoint enumeration test gains exactly one row. GET /sign-in changes additively (new form, new refusal keys)."
  - "API_DESIGN 2.6: step 5 of the sequence opens a RESTRICTED session whose every other authenticated request redirects to /sign-in/change-password; GET of that page answers 302 to /sign-in with no session and 302 to / when the session's password is not temporary, so it can never change a password without the old one having just been proved."
  - "API_DESIGN 2.7: a management action on an id that is not a Dean answers 404, not 403 - 403 would announce that the id exists (spec VR-005, I-8; API-5 allows 404 for a resource not visible to the caller)."
  - "API_DESIGN 2.10 recorded deviation: GET /settings/deans is NOT paginated although API-8 would paginate a growing collection. OD-003 resolved it as no search and no paging in v1, and the list is bounded by the school's staff rather than by synchronised data. Recorded in x-pagination-deviation so SECURITY_REVIEW meets a decision, not an oversight."
  - "API_DESIGN proposes three policy names for IMPLEMENTATION to register beside the existing three: ManageDeanAccounts (Admin), ChangeOwnPassword (Dean), CompleteTemporaryPasswordChange (a session whose password is temporary)."
  - "API_DESIGN §8 for DB_DESIGN: decide the AppUser field marking a password temporary, the new AuditAction and AuditTargetType members, the AuditRefusalCategory members the sign-in sequence needs beyond the existing AccountDisabled and ReadOnlyMode, and whether the audit check constraints need an amending migration (PC-2)."
