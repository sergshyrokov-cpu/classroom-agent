  - "Carried from the US-009 security review: F-2 (Informational) — a declared service write commits the WHOLE DbContext, not one row. US-012 writes an audit row on every management action and on every refused sign-in (Story AC-016); nothing else may be staged when a refusal commits its audit row."
  - "Carried from the US-011 security review: F-2 (Minor) — no test resolves a real adapter from the composition root. Not owned by US-012, recorded so it is not lost."
  - "Carried from the US-008 security review: F-5 (Minor, no security impact) — a wrong HTTP method on /sign-in/google or /sign-out answers 404 where the openapi documents 405. US-012 adds the Dean sign-in surface next to those routes; API_DESIGN decides whether the new routes repeat the same shape."
