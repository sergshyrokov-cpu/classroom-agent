  - "SPECIFICATION FR-015 for DB_DESIGN: one new table, one migration (AddSyncState), installation migrations five to six and tables five to six - AppUserMigrationTests asserts both today and is an EXPECTED change here. No existing table is altered; the Control Plane schema is untouched. VR-002 requires the singleton row and the status vocabulary to be enforced by check constraints, the legitimacy_state pattern, and leaves the bound on the stored error message to DB_DESIGN. FR-017: no audit member and no constraint-amending migration for the audit table, because a SCHEDULED run writes no audit row (§5 audits the MANUAL start, which is US-019). FR-018: no NuGet package and no translation key. PC-10's upsert, incremental and course-age rules belong to US-014, US-015 and US-018 and must NOT be pulled into SyncState."
  - "US-013 carries seven Open Decisions written into the Story, all resolved by the Owner on 2026-09-27 as option 1 before activation: OD-001 (host only - the service, the schedule, SyncState, the read-only refusal, the logging and the readiness contribution; the data comes with US-014, whose catalog entry stays), OD-002 (the interval is a new OPTIONAL installation setting with a default, so DC-3 grows by one key), OD-003 (one interval after a success and after a failure alike - retrying the call that failed is US-017), OD-004 (ONE SyncState row updated in place, as §3 describes it), OD-005 (a skipped run is a LOG LINE ONLY - BR-026 permits no synchronization write in read-only mode and its closed list can be extended only by a new version of §2), OD-006 (the first run waits for the first legitimacy determination, because an installation that has never completed a successful check IS read-only by BR-025) and OD-007 (the one-run-at-a-time coordinator is built HERE, as PushCheckCoordinator is for US-006; US-019 then adds only an endpoint, a policy and an audit row)."
