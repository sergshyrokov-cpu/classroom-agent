  - "US-011 carries five Open Decisions written into the Story, all resolved by the Owner on 2026-09-21 as option 1 before activation: OD-001 (Google's official .NET client libraries - Google.Apis.Auth, Google.Apis.Classroom.v1, Google.Apis.Admin.Reports.reports_v1 - added to Infrastructure only; this is the approval AGENTS.md requires for a new NuGet package), OD-002 (one token request per scope plus one minimal read per API), OD-003 (the result is not stored), OD-004 (the startup self-check logs a skip with its reason) and OD-005 (no rate limit). SPECIFICATION carries them into docs/decisions/US-011-open-decisions.md keeping their OD- ids."
